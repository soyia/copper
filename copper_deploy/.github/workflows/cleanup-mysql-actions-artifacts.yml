name: Clean Copper MySQL Actions artifacts

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: copper-mysql-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep the latest two successful MySQL runtime archives
    runs-on: ubuntu-24.04
    steps:
      - name: Check out cleanup policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Delete only expired Copper MySQL runtime generations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPPER_ARTIFACT_KEEP_SUCCESSFUL: '2'
        run: scripts/cleanup-mysql-actions-artifacts.sh

name: Verify M6 confidentiality gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      gate_mode:
        description: Use strict before any customer source or public Release candidate
        required: true
        default: strict
        type: choice
        options:
          - strict
          - new

permissions:
  contents: read

concurrency:
  group: verify-m6-confidentiality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit current tree and complete reachable history
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete reviewed history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          # Audit the submitted history, not GitHub's ephemeral pull-request merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run fail-closed confidentiality audit
        env:
          REQUESTED_GATE: ${{ inputs.gate_mode }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            gate=new
          else
            gate="${REQUESTED_GATE:-strict}"
          fi
          node scripts/security/audit-repositories.mjs \
            --repo copper_web=. \
            --config config/m6-confidentiality-audit.json \
            --baseline config/m6-known-confidentiality-findings.json \
            --gate "$gate" \
            --scope all \
            --report "$RUNNER_TEMP/copper-web-confidentiality-audit.json"

      - name: Upload redacted audit evidence
        if: always()
        # Pull requests remain blocked by the scanner itself. A temporary
        # repository artifact-quota exhaustion must not hide a clean scan.
        # Manual strict evidence runs still fail closed when upload is unavailable.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: copper-web-confidentiality-audit-${{ github.sha }}
          path: ${{ runner.temp }}/copper-web-confidentiality-audit.json
          if-no-files-found: error
          retention-days: 14

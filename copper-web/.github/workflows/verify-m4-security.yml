name: Verify Web security gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-m4-security.yml
      - Caddyfile
      - Dockerfile
      - package.json
      - pnpm-lock.yaml
      - config/m6-*.json
      - scripts/**
      - src/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test application contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          # The temporary PR merge commit may carry GitHub account metadata outside this source history.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reject new confidential content
        run: |
          set -Eeuo pipefail
          node scripts/security/audit-repositories.mjs \
            --repo copper_web=. \
            --config config/m6-confidentiality-audit.json \
            --baseline config/m6-known-confidentiality-findings.json \
            --gate new \
            --scope all \
            --report "$RUNNER_TEMP/copper-web-pr-confidentiality-audit.json"

      - name: Run production contract and application build
        run: |
          set -Eeuo pipefail
          corepack enable
          corepack prepare pnpm@9.15.7 --activate
          pnpm install --frozen-lockfile
          pnpm test:production
          pnpm build

  verify-image:
    name: Build native ${{ matrix.platform }} without publishing
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Build the production image without publishing
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -Eeuo pipefail
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker buildx build \
            --platform "$PLATFORM" \
            --provenance=false \
            --sbom=false \
            --build-arg COPPER_VERSION=0.0.0-ci.${GITHUB_RUN_ID} \
            --build-arg COPPER_REVISION=${SOURCE_SHA} \
            --build-arg COPPER_BUILD_TIME=${created} \
            --output type=cacheonly \
            .
